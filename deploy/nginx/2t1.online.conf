# 2t1auth reverse proxy for 2t1.online
# Behind Cloudflare (SSL/TLS mode: Full (strict)) using a Cloudflare Origin Certificate.
#
# Install:
#   sudo cp deploy/nginx/2t1.online.conf /etc/nginx/sites-available/2t1.online
#   sudo ln -sf /etc/nginx/sites-available/2t1.online /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

# --- Restore the real visitor IP from Cloudflare (else every request looks like a CF IP) ---
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Redirect plain HTTP to HTTPS (Cloudflare talks to the origin over HTTPS in Full strict).
server {
    listen 80;
    listen [::]:80;
    server_name 2t1.online www.2t1.online;
    return 301 https://$host$request_uri;
}

server {
    # HTTP/2 as a listen parameter rather than the standalone `http2 on;`
    # directive: that directive landed in nginx 1.25.1, and Ubuntu ships older
    # (22.04 → 1.18, 24.04 → 1.24), where it fails the config outright with
    # `unknown directive "http2"`. This form works on every version; 1.25.1+
    # accepts it with a deprecation warning.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 2t1.online www.2t1.online;

    # Cloudflare Origin Certificate (created in the Cloudflare dashboard).
    ssl_certificate     /etc/ssl/cloudflare/2t1.online.pem;
    ssl_certificate_key /etc/ssl/cloudflare/2t1.online.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Scripts can be large; allow generous upload for the admin API.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
